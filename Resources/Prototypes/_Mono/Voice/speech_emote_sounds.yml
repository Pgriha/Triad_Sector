- type: emoteSounds
  id: UnisexHydrakin
  params:
    variation: 0.125
    # Triad: dropped `volume: -8` so Hydrakin emotes play at default loudness, matching peer species
  sounds:
    Scream:
      collection: HydrakinScream
    Laugh:
      collection: HydrakinLaugh
    Crying:
      collection: HydrakinCry
    Sigh:
      collection: HydrakinSigh
    Gasp:
      collection: HydrakinGasp
    Trill:
      collection: HydrakinTrill
    Wurble:
      collection: HydrakinWurble
    Cough:
      collection: HydrakinCough
    Yawn:
      collection: HydrakinYawn
    Whistle:
      collection: HydrakinWhistle
    DefaultDeathgasp:
      collection: HydrakinDeathgasp
    # Cheeburbr start
    Gulp:
      path: /Audio/_Goobstation/Voice/gulpexotic.ogg
    Surprised:
      path: /Audio/_Goobstation/Voice/surprised.ogg
    # Cheeburbr end

- type: speechSounds
  id: Hydrakin
  saySound:
    collection: HydrakinSay
  askSound:
    collection: HydrakinAsk
  exclaimSound:
    collection: HydrakinExclaim
