# Ніани by Міюгі
- type: entity
  parent: PlushieMoth
  id: BrbrBasePlushieMoff
  suffix: Сирбурбер
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Voice/Moth/moth_gasp.ogg # Душать бідось
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Voice/Moth/moth_chitter.ogg
  - type: EmitSoundOnLand
    sound: &PlushieMoffSound
      path: /Audio/Voice/Moth/moth_squeak.ogg
  - type: EmitSoundOnActivate
    sound: *PlushieMoffSound
  - type: EmitSoundOnTrigger
    sound: *PlushieMoffSound
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Voice/Moth/moth_scream.ogg
  - type: MeleeWeapon
    soundHit: *PlushieMoffSound
  - type: Food
    useSound: /Audio/Voice/Moth/moth_laugh.ogg
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
  - type: SolutionContainerManager #More food for moff from moff
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Fiber
          Quantity: 15
  - type: UseDelay
    delay: 0.5
  - type: Clothing
    slots:
    - HEAD

## Міріадея. Міріадея Шовковязна. Персонажка Міюгі, авторки спрайтів серії цих плюшів
- type: entity
  parent: BrbrBasePlushieMoff
  id: BrbrPlushieMoffMiriadeya
  name: плюшева ніана "Міріадея"
  description: " \"Темне тіло, що усіяне світлими плямами й ніжно переливається з ними, нагадує собою космічний пейзаж. Крила ж більш темні та прикрашені ледь чи не чорними візерунками. Виглядає більш розпушеною та м'якою, ніж має бути.\"
    \n\nПросто іграшка у вигляді якоїсь фіолетовопухої ніани."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Miriadea/base.rsi
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: SolutionContainerManager #Бавовна.
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 20

- type: entity
  parent: BrbrPlushieMoffMiriadeya
  id: BrbrPlushieMoffMiriadeyaBar
  name: плюшева ніана "Міріадея сервіс"
  description: " \"Дззз!\"
    \n\nВід погляду на неї ви відчуваєте внутрішню тривогу, що в сервісі сьогодні знову будуть подавати одну бавовняну випічку. . ."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Miriadea/service.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: SolutionContainerManager #Бавовна з. . . Почнемо з цукру? А, й муки :)
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Fiber
          Quantity: 20
        - ReagentId: Sugar
          Quantity: 2.5
        - ReagentId: Flour
          Quantity: 2.5

- type: entity
  parent: BrbrPlushieMoffMiriadeya
  id: BrbrPlushieMoffMiriadeyaScience
  name: плюшева ніана "Міріадея наука"
  description: " \"Наука — це вибухи та підпали, тому- Це з неї попіл посипався? . .\"
    \n\nОдяг вченої на ній виглядає ідеально, проте здається, наче від неї доноситься запах горілого пуху. . ."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Miriadea/scientist.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: SolutionContainerManager #plasma
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 15
        - ReagentId: Ash
          Quantity: 5

## Мірка. Мірка Злидина. Персонаж Дітрита
- type: entity
  parent: BrbrBasePlushieMoff
  id: BrbrPlushieMoffMirka
  name: плюшева ніана "Мірка"
  description: " \"Пухнастий дисонанс - по-іншому це не назвеш, бо як таке диво може бути блакитним, як небо, а пухким, як хмара!\"
    \n\nПросто іграшка у вигляді якогось блакитнопухого ніани (чи ніана?. .). Від неї ніби віє легким запахом алкоголю."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Mirka/base.rsi
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.0625"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 15
        - ReagentId: Ethanol #:stare:
          Quantity: 5

- type: entity
  parent: BrbrPlushieMoffMirka
  id: BrbrPlushieMoffMirkaBar
  name: плюшева ніана "Мірка бар"
  description: " \"Це птах? Це літак? Ні! Це Мірчук Злиденюк!\"
    \n\nЦя версія одягнута у форму бармена та виглядає більш бойовою, запах алкоголю явно став сильніше."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Mirka/bartender.rsi

- type: entity
  parent: BrbrPlushieMoffMirka
  id: BrbrPlushieMoffMirkaService
  name: плюшева ніана "Мірка сервіс"
  description: " \"Кззз-\"
    \n\nЦя версія одягнута у форму сервісника. Виглядає так, ніби її били. . ."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Mirka/service.rsi

## Ранч. Ранч Епіполос. Персонаж Пігріхи
- type: entity
  parent: BrbrBasePlushieMoff
  id: BrbrPlushieMoffRanch
  name: плюшева ніана "Ранч"
  description: " \"Нічим непримітний у плані зовнішності, синього кольору, антенки та крила зазвичай притиснуті до тіла, другі мають візерунок схожий на дуже бідне нічне небо, праве чутка припущене. Очі темно-синього кольору постійно бігають, концентруючись та звертаючи увагу на будь-яку хоч малу дію з боку оточення.\"
    \n\nПросто іграшка у вигляді якогось синьогопухого ніана (чи ніани?. .)"
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Ranch/base.rsi
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.09375"

- type: entity
  parent: BrbrPlushieMoffRanch
  id: BrbrPlushieMoffRanchBar
  name: плюшева ніана "Ранч бар"
  description: " Дивлячись на цю іграшку з'являється відчуття, що вас зараз будуть допитувати.
    \n\nОдягнута у форму бармена та від неї ніби пахне сумішшю морозива з. . Алкоголем?"
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Ranch/bartender.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 15
        - ReagentId: IceCream #Хмммм
          Quantity: 4
        - ReagentId: Ethanol #Він все ще не п'є!
          Quantity: 1

- type: entity
  parent: BrbrPlushieMoffRanch
  id: BrbrPlushieMoffRanchBotanic
  name: плюшева ніана "Ранч ботаніка"
  description: " \"Свіжа бавовна на стійці ботаніки!\", - лунає у вашій голові при погляді на цього плюша.
    \n\nОдягнута у форму ботаніка та від неї пахне землею."
  components:
  - type: Sprite
    sprite: _Cheeburbr/Objects/Fun/Plushies/Moffs/Ranch/botanist.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 15
        - ReagentId: EZNutrient #Ботанік все ж
          Quantity: 5
